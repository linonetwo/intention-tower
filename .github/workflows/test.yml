name: Verify game

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Frontend, Rust core, 21 levels and real-browser MCP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: intention-tower-game

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: intention-tower-game/pnpm-lock.yaml

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: intention-tower-game/src-tauri -> target
          shared-key: verify-core
          cache-on-failure: true

      - name: Install frontend dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production GPT Image 2 assets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:assets

      - name: Type-check frontend
        id: typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm check

      - name: Run frontend tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:ui

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint authoritative Rust core
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features test-server --all-targets -- -D warnings

      - name: Test authoritative Rust core
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-server --lib --tests --no-fail-fast

      - name: Build standalone MCP core
        id: core_build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features test-server --example intention-tower-mcp

      - name: Start standalone MCP core
        id: core_start
        if: ${{ !cancelled() && steps.core_build.outcome == 'success' }}
        run: |
          src-tauri/target/debug/examples/intention-tower-mcp > "$RUNNER_TEMP/intention-tower-mcp.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/intention-tower-mcp.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:9222/health; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/intention-tower-mcp.log"
          exit 1

      - name: Play all 21 levels through MCP
        if: ${{ !cancelled() && steps.core_start.outcome == 'success' }}
        run: pnpm test:mcp:levels

      - name: Build reusable web
        id: web_build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        run: pnpm build

      - name: Assemble reusable web and MCP core
        if: ${{ !cancelled() && steps.web_build.outcome == 'success' && steps.core_build.outcome == 'success' }}
        run: |
          mkdir -p verification-bundle/scripts verification-bundle/assets
          cp src-tauri/target/debug/examples/intention-tower-mcp verification-bundle/
          strip verification-bundle/intention-tower-mcp
          cp -r dist verification-bundle/
          cp -r assets/levels verification-bundle/assets/
          cp scripts/browser-mcp.mjs scripts/verify-browser-mcp.mjs scripts/serve-playtest.mjs verification-bundle/scripts/
          cp scripts/PLAYTEST.md verification-bundle/README.md

      - name: Install CI-only browser tooling
        id: browser_dependencies
        timeout-minutes: 7
        if: ${{ !cancelled() && steps.core_start.outcome == 'success' && steps.web_build.outcome == 'success' }}
        run: |
          timeout --kill-after=10s 120s npm install --prefix .verification-tools --no-package-lock --no-save --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.58.2
          export PLAYWRIGHT_MODULE="$PWD/.verification-tools/node_modules/playwright/index.mjs"
          if browser_executable=$(timeout --kill-after=5s 60s node scripts/browser-mcp.mjs --probe-browser); then
            echo "Reusing launch-verified browser: $browser_executable"
          else
            echo "No usable existing browser. Downloading only the real Chromium headless shell (no apt install)."
            export PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=20000
            timeout --kill-after=10s 180s .verification-tools/node_modules/.bin/playwright install --only-shell chromium
            browser_executable=$(timeout --kill-after=5s 60s node scripts/browser-mcp.mjs --probe-browser)
          fi
          echo "CHROMIUM_EXECUTABLE_PATH=$browser_executable" >> "$GITHUB_ENV"

      - name: Real desktop and mobile UI playthrough via browser MCP adapter
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.core_start.outcome == 'success' && steps.web_build.outcome == 'success' && steps.browser_dependencies.outcome == 'success' }}
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.verification-tools/node_modules/playwright/index.mjs"
          node scripts/browser-mcp.mjs > verification-browser.log 2>&1 &
          echo $! > verification-browser.pid
          node scripts/verify-browser-mcp.mjs

      - name: Upload screenshots and authoritative reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-mcp-evidence
          path: |
            intention-tower-game/verification-evidence/
            intention-tower-game/verification-browser.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dependency-free Linux core and built web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-mcp-web-linux
          path: intention-tower-game/verification-bundle/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop standalone MCP core
        if: always()
        run: |
          if [ -f verification-browser.pid ]; then
            kill "$(cat verification-browser.pid)" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/intention-tower-mcp.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/intention-tower-mcp.pid")" 2>/dev/null || true
          fi

      - name: Upload MCP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-verification-log
          path: ${{ runner.temp }}/intention-tower-mcp.log
          if-no-files-found: ignore
          retention-days: 14
