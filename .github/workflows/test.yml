name: Verify game

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Frontend, Rust core, 21 levels and real-browser MCP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: intention-tower-game

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: intention-tower-game/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: intention-tower-game/src-tauri -> target
          shared-key: verify-core

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production GPT Image 2 assets
        run: pnpm test:assets

      - name: Type-check frontend
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test:ui

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint authoritative Rust core
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features test-server --all-targets -- -D warnings

      - name: Test authoritative Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-server --lib --tests

      - name: Start standalone MCP core
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --no-default-features --features test-server --example intention-tower-mcp > "$RUNNER_TEMP/intention-tower-mcp.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/intention-tower-mcp.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:9222/health; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/intention-tower-mcp.log"
          exit 1

      - name: Play all 21 levels through MCP
        run: pnpm test:mcp:levels

      - name: Build reusable web and MCP core
        if: ${{ !cancelled() }}
        run: |
          pnpm build
          cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features test-server --example intention-tower-mcp
          mkdir -p verification-bundle/scripts verification-bundle/assets
          cp src-tauri/target/debug/examples/intention-tower-mcp verification-bundle/
          strip verification-bundle/intention-tower-mcp
          cp -r dist verification-bundle/
          cp -r assets/levels verification-bundle/assets/
          cp scripts/browser-mcp.mjs scripts/verify-browser-mcp.mjs scripts/serve-playtest.mjs verification-bundle/scripts/
          cp scripts/PLAYTEST.md verification-bundle/README.md

      - name: Install CI-only browser tooling
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix .verification-tools --no-package-lock --no-save playwright@1.58.2
          .verification-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Real desktop and mobile UI playthrough via browser MCP adapter
        if: ${{ !cancelled() }}
        run: |
          export PLAYWRIGHT_MODULE="$PWD/.verification-tools/node_modules/playwright/index.mjs"
          node scripts/browser-mcp.mjs > verification-browser.log 2>&1 &
          echo $! > verification-browser.pid
          node scripts/verify-browser-mcp.mjs

      - name: Upload screenshots and authoritative reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-mcp-evidence
          path: |
            intention-tower-game/verification-evidence/
            intention-tower-game/verification-browser.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dependency-free Linux core and built web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-mcp-web-linux
          path: intention-tower-game/verification-bundle/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop standalone MCP core
        if: always()
        run: |
          if [ -f verification-browser.pid ]; then
            kill "$(cat verification-browser.pid)" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/intention-tower-mcp.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/intention-tower-mcp.pid")" 2>/dev/null || true
          fi

      - name: Upload MCP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-verification-log
          path: ${{ runner.temp }}/intention-tower-mcp.log
          if-no-files-found: ignore
          retention-days: 14
