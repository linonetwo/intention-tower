name: Build playtest artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  desktop:
    name: ${{ matrix.label }} playtest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact: intention-tower-linux
          - os: windows-latest
            label: Windows
            artifact: intention-tower-windows
          - os: macos-latest
            label: macOS
            artifact: intention-tower-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: intention-tower-game

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: intention-tower-game/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: intention-tower-game/src-tauri -> target
          shared-key: playtest-${{ runner.os }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release inputs
        run: |
          pnpm test:assets
          pnpm check
          pnpm test:ui

      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb

      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles msi,nsis

      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app,dmg

      - name: Upload Linux playtest
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            intention-tower-game/src-tauri/target/release/bundle/appimage/*.AppImage
            intention-tower-game/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows playtest
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            intention-tower-game/src-tauri/target/release/bundle/msi/*.msi
            intention-tower-game/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS playtest
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            intention-tower-game/src-tauri/target/release/bundle/dmg/*.dmg
            intention-tower-game/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
