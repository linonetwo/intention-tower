name: Build Windows playtest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  windows:
    name: Windows x64 playtest (Linux cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: intention-tower-game

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set SDK cache location
        run: echo "XWIN_CACHE_DIR=$RUNNER_TEMP/xwin-cache" >> "$GITHUB_ENV"

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nsis

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: intention-tower-game/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: intention-tower-game/src-tauri -> target
          shared-key: playtest-linux-windows-x64
          cache-on-failure: true

      - name: Cache Windows SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-${{ runner.os }}-${{ runner.arch }}-cargo-xwin-0.23.1

      - name: Install cargo-xwin
        run: cargo install --locked --version 0.23.1 cargo-xwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release inputs
        run: |
          pnpm test:assets
          pnpm check
          pnpm test:ui

      - name: Build Windows NSIS installer
        run: ./scripts/build-windows-nsis.sh

      - name: Upload Windows playtest
        uses: actions/upload-artifact@v4
        with:
          name: intention-tower-windows
          path: intention-tower-game/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
