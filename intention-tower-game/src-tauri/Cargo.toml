[package]
name = "intention-tower-game"
version = "0.9.0"
description = "A deterministic mind-graph simulation strategy game"
authors = ["linonetwo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "intention_tower_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
test-server = ["dep:axum", "dep:tokio", "dep:crossbeam-channel", "dep:tower-http"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
backoff = "0.4"
serde_json = "1"
futures = "0.3"

[[test]]
name = "cucumber"
harness = false

[[bin]]
name = "intention-tower-game"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "intention-tower-mcp"
path = "src/bin/intention_tower_mcp.rs"
required-features = ["test-server"]
